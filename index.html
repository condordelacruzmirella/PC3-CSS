<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Interactivo</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>


    <div class="container text-center my-3">
        <div class="loader mx-auto"></div>
    </div>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/portafolio.png" alt="Logo" width="30">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#proyectos">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container text-center my-4" id="inicio">
        <div class="caja-animada p-3 text-white rounded">
            Elemento Animado
        </div>
    </div>


    <section class="container my-5" id="proyectos">
        <div class="row text-center">
            <div class="col-sm-12 col-md-4 mb-3">
                <div class="caja caja-rotar p-4 bg-light rounded">Rotación (rotate)</div>
            </div>
            <div class="col-sm-12 col-md-4 mb-3">
                <div class="caja caja-escalar p-4 bg-light rounded">Escalado (scale)</div>
            </div>
            <div class="col-sm-12 col-md-4 mb-3">
                <div class="caja caja-trasladar p-4 bg-light rounded">Traslación (translate)</div>
            </div>
        </div>
    </section>


    <div class="container text-center my-5">
        <div class="contenedor-3d">
            <img src="img/desarrollo-web-a-medida.png" alt="Imagen 3D" class="imagen-3d rounded">
        </div>
    </div>


    <section class="container my-5" id="contacto">
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-6">
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="3"></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary">Enviar</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>
    </section>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
